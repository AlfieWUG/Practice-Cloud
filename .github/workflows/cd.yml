name: CD - Deploy to AWS

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod

env:
  AWS_REGION: eu-central-1
  PYTHON_VERSION: '3.11'

jobs:
  # Build Lambda packages
  build-lambda:
    name: Build Lambda Packages
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Build Lambda layer
        run: |
          if [ -f "infrastructure/lambda/build.sh" ]; then
            cd infrastructure/lambda
            chmod +x build.sh
            ./build.sh
          else
            echo "No Lambda build script found"
          fi
      
      - name: Upload Lambda artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lambda-packages
          path: |
            infrastructure/lambda/*.zip
          retention-days: 7

  # Build and push Docker image
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [build-lambda]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: |
            agentic-services:${{ github.sha }}
            agentic-services:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Save Docker image
        run: |
          docker save agentic-services:${{ github.sha }} | gzip > docker-image.tar.gz
      
      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: docker-image.tar.gz
          retention-days: 7

  # Deploy to Development
  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: [build-lambda, build-docker]
    if: github.ref == 'refs/heads/develop' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')
    environment:
      name: development
      url: ${{ steps.deploy.outputs.api_url }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Download Lambda packages
        uses: actions/download-artifact@v4
        with:
          name: lambda-packages
          path: infrastructure/lambda/
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0
      
      - name: Terraform Init
        run: |
          cd infrastructure/terraform
          terraform init
      
      - name: Terraform Plan
        run: |
          cd infrastructure/terraform
          terraform workspace select dev || terraform workspace new dev
          terraform plan -var="environment=dev" -out=tfplan
      
      - name: Terraform Apply
        id: deploy
        run: |
          cd infrastructure/terraform
          terraform apply -auto-approve tfplan
          echo "api_url=$(terraform output -raw api_gateway_endpoint)" >> $GITHUB_OUTPUT
      
      - name: Run smoke tests
        run: |
          API_URL="${{ steps.deploy.outputs.api_url }}"
          echo "Testing API at: $API_URL"
          curl -f "$API_URL/health" || exit 1
          curl -f "$API_URL/agents" || exit 1
        continue-on-error: true

  # Deploy to Staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-lambda, build-docker]
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.api_url }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Download Lambda packages
        uses: actions/download-artifact@v4
        with:
          name: lambda-packages
          path: infrastructure/lambda/
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0
      
      - name: Terraform Init
        run: |
          cd infrastructure/terraform
          terraform init
      
      - name: Terraform Plan
        run: |
          cd infrastructure/terraform
          terraform workspace select staging || terraform workspace new staging
          terraform plan -var="environment=staging" -out=tfplan
      
      - name: Terraform Apply
        id: deploy
        run: |
          cd infrastructure/terraform
          terraform apply -auto-approve tfplan
          echo "api_url=$(terraform output -raw api_gateway_endpoint)" >> $GITHUB_OUTPUT
      
      - name: Run smoke tests
        run: |
          API_URL="${{ steps.deploy.outputs.api_url }}"
          echo "Testing API at: $API_URL"
          curl -f "$API_URL/health" || exit 1
          curl -f "$API_URL/agents" || exit 1

  # Deploy to Production
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-lambda, build-docker, deploy-staging]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod')
    environment:
      name: production
      url: ${{ steps.deploy.outputs.api_url }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_PROD_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_PROD_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Download Lambda packages
        uses: actions/download-artifact@v4
        with:
          name: lambda-packages
          path: infrastructure/lambda/
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0
      
      - name: Terraform Init
        run: |
          cd infrastructure/terraform
          terraform init
      
      - name: Terraform Plan
        run: |
          cd infrastructure/terraform
          terraform workspace select prod || terraform workspace new prod
          terraform plan -var="environment=prod" -out=tfplan
      
      - name: Terraform Apply
        id: deploy
        run: |
          cd infrastructure/terraform
          terraform apply -auto-approve tfplan
          echo "api_url=$(terraform output -raw api_gateway_endpoint)" >> $GITHUB_OUTPUT
      
      - name: Run smoke tests
        run: |
          API_URL="${{ steps.deploy.outputs.api_url }}"
          echo "Testing API at: $API_URL"
          curl -f "$API_URL/health" || exit 1
          curl -f "$API_URL/agents" || exit 1
      
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          body: |
            Production deployment of Agentic Services Platform
            
            ## What's Deployed
            - All 24 AI agents
            - Complete infrastructure (Terraform)
            - Lambda functions and API Gateway
            
            ## API Endpoint
            ${{ steps.deploy.outputs.api_url }}
          draft: false
          prerelease: false

  # Notify deployment status
  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [deploy-dev, deploy-staging, deploy-prod]
    if: always()
    
    steps:
      - name: Send deployment notification
        run: |
          echo "Deployment completed for all environments"
          echo "Check GitHub Actions for detailed results"
