name: Scheduled - Nightly Tests & Security Scans

on:
  schedule:
    # Run every night at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'

jobs:
  # Nightly comprehensive test suite
  nightly-tests:
    name: Nightly Full Test Suite
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      
      - name: Run all tests with verbose output
        run: |
          pytest tests/ -vv \
            --cov=src/agentic_services \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term \
            --junitxml=junit.xml \
            --tb=long
      
      - name: Generate detailed coverage report
        run: |
          coverage report --show-missing > coverage-report.txt
          cat coverage-report.txt
      
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-test-results
          path: |
            htmlcov/
            coverage.xml
            junit.xml
            coverage-report.txt
          retention-days: 14
      
      - name: Check coverage threshold
        run: |
          COVERAGE=$(coverage report | tail -1 | awk '{print $NF}' | sed 's/%//')
          echo "Current coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "⚠️ Coverage is below 80% threshold"
            exit 1
          fi
        continue-on-error: true

  # Security vulnerability scanning
  security-scan:
    name: Comprehensive Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install safety pip-audit bandit semgrep
      
      - name: Run Safety check
        run: |
          safety check --json --output safety-report.json || true
          safety check || true
      
      - name: Run pip-audit
        run: |
          pip-audit --format json --output pip-audit-report.json || true
          pip-audit || true
      
      - name: Run Bandit
        run: |
          bandit -r src/ -f json -o bandit-report.json || true
          bandit -r src/ -ll || true
      
      - name: Run Semgrep
        run: |
          semgrep --config=auto src/ --json --output semgrep-report.json || true
          semgrep --config=auto src/ || true
        continue-on-error: true
      
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-reports
          path: |
            safety-report.json
            pip-audit-report.json
            bandit-report.json
            semgrep-report.json
          retention-days: 30

  # Dependency updates check
  dependency-check:
    name: Check for Dependency Updates
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install pip-tools
        run: pip install pip-tools
      
      - name: Check for outdated packages
        run: |
          pip list --outdated > outdated-packages.txt
          cat outdated-packages.txt
      
      - name: Upload dependency report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-report
          path: outdated-packages.txt
          retention-days: 7

  # Performance tests
  performance-tests:
    name: Performance & Load Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pytest-benchmark locust
      
      - name: Run performance tests
        run: |
          if [ -d "tests/performance" ]; then
            pytest tests/performance/ -v --benchmark-only
          else
            echo "No performance tests found"
          fi
        continue-on-error: true

  # Code quality metrics
  code-quality:
    name: Code Quality Metrics
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install quality tools
        run: |
          pip install --upgrade pip
          pip install radon pylint flake8 mccabe
      
      - name: Calculate cyclomatic complexity
        run: |
          radon cc src/ -a -s > complexity-report.txt
          cat complexity-report.txt
      
      - name: Calculate maintainability index
        run: |
          radon mi src/ -s > maintainability-report.txt
          cat maintainability-report.txt
      
      - name: Run pylint
        run: |
          pylint src/ --output-format=json > pylint-report.json || true
          pylint src/ || true
        continue-on-error: true
      
      - name: Upload quality reports
        uses: actions/upload-artifact@v4
        with:
          name: code-quality-reports
          path: |
            complexity-report.txt
            maintainability-report.txt
            pylint-report.json
          retention-days: 14

  # Notification of results
  notify-results:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [nightly-tests, security-scan, dependency-check, performance-tests, code-quality]
    if: always()
    
    steps:
      - name: Generate summary
        run: |
          echo "# Nightly Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "- Nightly Tests: ${{ needs.nightly-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Security Scan: ${{ needs.security-scan.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Dependency Check: ${{ needs.dependency-check.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Performance Tests: ${{ needs.performance-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Code Quality: ${{ needs.code-quality.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 All reports available in workflow artifacts" >> $GITHUB_STEP_SUMMARY
