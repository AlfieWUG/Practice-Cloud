name: CI - Test All Agents

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'

jobs:
  # Code quality checks
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install linting tools
        run: |
          pip install --upgrade pip
          pip install ruff black isort mypy
      
      - name: Check code formatting with Black
        run: black --check src/ tests/
        continue-on-error: true
      
      - name: Check import sorting with isort
        run: isort --check-only src/ tests/
        continue-on-error: true
      
      - name: Lint with Ruff
        run: ruff check src/ tests/
        continue-on-error: true
      
      - name: Type check with mypy
        run: mypy src/ --ignore-missing-imports
        continue-on-error: true

  # Unit tests for all agents
  test-agents:
    name: Test All Agents
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        agent-group:
          - discovery
          - assessment
          - execution
          - optimization
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      
      - name: Run tests for ${{ matrix.agent-group }} agents
        run: |
          case "${{ matrix.agent-group }}" in
            discovery)
              pytest tests/agents/test_discovery_agent.py \
                     tests/agents/test_analysis_agent.py \
                     tests/agents/test_planning_agent.py \
                     tests/agents/test_artifact_generation_agent.py \
                     tests/agents/test_network_scanner_agent.py \
                     tests/agents/test_application_profiler_agent.py \
                     tests/agents/test_performance_monitor_agent.py \
                     tests/agents/test_data_classifier_agent.py \
                     -v --cov=src/agentic_services/agents --cov-report=xml --cov-report=term-missing
              ;;
            assessment)
              pytest tests/agents/test_dependency_mapper_agent.py \
                     tests/agents/test_compliance_checker_agent.py \
                     tests/agents/test_cost_estimator_agent.py \
                     tests/agents/test_risk_assessment_agent.py \
                     tests/agents/test_capacity_planner_agent.py \
                     -v --cov=src/agentic_services/agents --cov-report=xml --cov-report=term-missing
              ;;
            execution)
              pytest tests/agents/test_infrastructure_provisioner_agent.py \
                     tests/agents/test_data_migration_agent.py \
                     tests/agents/test_application_migration_agent.py \
                     tests/agents/test_configuration_agent.py \
                     tests/agents/test_testing_agent.py \
                     tests/agents/test_rollback_agent.py \
                     -v --cov=src/agentic_services/agents --cov-report=xml --cov-report=term-missing
              ;;
            optimization)
              pytest tests/agents/test_performance_optimizer_agent.py \
                     tests/agents/test_cost_optimizer_agent.py \
                     tests/agents/test_security_hardening_agent.py \
                     tests/agents/test_monitoring_setup_agent.py \
                     tests/agents/test_documentation_agent.py \
                     -v --cov=src/agentic_services/agents --cov-report=xml --cov-report=term-missing
              ;;
          esac
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: ${{ matrix.agent-group }}
          name: ${{ matrix.agent-group }}-coverage
        continue-on-error: true

  # Full test suite with coverage
  test-full:
    name: Full Test Suite with Coverage
    runs-on: ubuntu-latest
    needs: [lint, test-agents]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      
      - name: Run all tests with coverage
        run: |
          pytest tests/ -v \
            --cov=src/agentic_services \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term-missing \
            --junitxml=junit.xml
      
      - name: Generate coverage badge
        run: |
          COVERAGE=$(coverage report | tail -1 | awk '{print $NF}')
          echo "Coverage: $COVERAGE"
          echo "COVERAGE=$COVERAGE" >> $GITHUB_ENV
      
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            htmlcov/
            coverage.xml
            junit.xml
          retention-days: 30
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: full-suite
          name: full-coverage
        continue-on-error: true
      
      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
        continue-on-error: true

  # Integration tests
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test-full]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      
      - name: Run integration tests
        run: |
          if [ -d "tests/integration" ]; then
            pytest tests/integration/ -v --junitxml=integration-junit.xml
          else
            echo "No integration tests found"
          fi
        continue-on-error: true
      
      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: integration-junit.xml
          retention-days: 30

  # Security scanning
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install security tools
        run: |
          pip install --upgrade pip
          pip install safety pip-audit bandit
      
      - name: Run Safety check
        run: safety check --json || true
        continue-on-error: true
      
      - name: Run pip-audit
        run: pip-audit || true
        continue-on-error: true
      
      - name: Run Bandit security linter
        run: bandit -r src/ -f json -o bandit-report.json || true
        continue-on-error: true
      
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: bandit-report.json
          retention-days: 30

  # Test summary
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [lint, test-agents, test-full]
    if: always()
    
    steps:
      - name: Check test results
        run: |
          echo "## Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ All agent tests completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Groups:" >> $GITHUB_STEP_SUMMARY
          echo "- Discovery Phase: 8 agents" >> $GITHUB_STEP_SUMMARY
          echo "- Assessment Phase: 5 agents" >> $GITHUB_STEP_SUMMARY
          echo "- Execution Phase: 6 agents" >> $GITHUB_STEP_SUMMARY
          echo "- Optimization Phase: 5 agents" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total: 24 agents tested** 🚀" >> $GITHUB_STEP_SUMMARY
